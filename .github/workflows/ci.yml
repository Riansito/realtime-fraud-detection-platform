name: CI/CD Pipeline

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  lint-and-test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres_password
          POSTGRES_DB: fraud_detection
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: "pip"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install ruff dbt-postgres pytest httpx fastapi uvicorn pydantic python-dotenv asyncpg aiokafka structlog

      - name: Run Ruff Linter
        run: |
          ruff check .
          ruff format --check .

      - name: Run Pytest
        env:
          PYTHONPATH: .
        run: |
          pytest tests/

      - name: Run dbt Tests
        env:
          POSTGRES_HOST: localhost
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres_password
          POSTGRES_PORT: 5432
          POSTGRES_DB: fraud_detection
          POSTGRES_SCHEMA: public
        run: |
          export PGPASSWORD=postgres_password
          psql -h localhost -U postgres -d fraud_detection -c "CREATE SCHEMA IF NOT EXISTS silver;"
          psql -h localhost -U postgres -d fraud_detection -c "CREATE TABLE silver.transactions (transaction_id VARCHAR, account_id VARCHAR, customer_id VARCHAR, merchant_id VARCHAR, merchant_category VARCHAR, amount FLOAT, currency VARCHAR, payment_method VARCHAR, device_id VARCHAR, ip_address VARCHAR, region VARCHAR, event_time TIMESTAMP, kafka_offset BIGINT, bronze_ingestion_date DATE, risk_score FLOAT, is_fraud_suspect BOOLEAN, fraud_reason VARCHAR, processed_at TIMESTAMP, event_date DATE);"
          cd analytics
          dbt deps
          # We run dbt debug to ensure connection works, 
          # but we need to create the schemas and models before testing them.
          # In a real environment, you might only run `dbt parse` or run `dbt build` on an empty DB.
          # Here we run `dbt build` which will run models and tests.
          dbt debug
          dbt build
